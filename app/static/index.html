<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI迷宫玩家</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui,-apple-system,sans-serif; background:#0f0f1a; color:#e0e0e0; min-height:100vh; }
.header { background:linear-gradient(135deg,#1a1a2e,#16213e); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a2a4a; }
.header h1 { font-size:20px; }
.header .sub { font-size:10px; opacity:0.6; margin-top:2px; }
.task-selector { display:flex; gap:6px; align-items:center; }
.task-btn { padding:7px 16px; border-radius:6px; cursor:pointer; border:1px solid #3a3a5a; font-size:12px; transition:all .2s; background:transparent; color:#aab; }
.task-btn.active { background:#2ecc71; color:#fff; border-color:#2ecc71; }
.task-btn.active.global { background:#3498db; border-color:#3498db; }
.tab-btn { padding:7px 16px; border-radius:6px; cursor:pointer; border:none; font-size:12px; transition:all .2s; background:transparent; color:#aab; }
.tab-btn.active { background:rgba(255,255,255,0.12); color:#fff; }
.main { display:grid; grid-template-columns:370px 1fr; gap:12px; padding:12px; max-width:1400px; margin:0 auto; height:calc(100vh - 75px); }
.panel { background:#1a1a2e; border-radius:8px; padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.panel h3 { font-size:13px; margin-bottom:2px; }
.right-panel { background:#1a1a2e; border-radius:8px; padding:12px; overflow-y:auto; }
textarea { width:100%; font-family:'Consolas',monospace; font-size:10px; padding:8px; border:1px solid #333; border-radius:4px; resize:vertical; background:#0d0d1a; color:#c8d6e5; }
.btn { padding:7px 14px; border:none; border-radius:4px; cursor:pointer; font-size:12px; font-weight:bold; color:#fff; transition:opacity .2s; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.btn-green { background:#2ecc71; }
.btn-blue { background:#3498db; }
.btn-orange { background:#e67e22; }
.btn-gray { background:#7f8c8d; }
.btn-dark { background:#34495e; }
.btn-sm { padding:5px 8px; font-size:11px; }
.btn-row { display:flex; gap:5px; flex-wrap:wrap; }
.toast { padding:8px 12px; border-radius:4px; font-size:11px; display:none; }
.toast.error { background:#4a1a1a; color:#e74c3c; display:block; }
.toast.success { background:#1a3a1a; color:#2ecc71; display:block; }
.maze-grid { display:inline-grid; gap:1px; background:#333; border:2px solid #333; border-radius:4px; }
.cell { display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:10px; transition:background-color .3s; cursor:default; }
.legend { display:flex; gap:12px; flex-wrap:wrap; font-size:10px; margin-top:8px; }
.legend-item { display:flex; align-items:center; gap:3px; }
.legend-sq { width:14px; height:14px; border-radius:2px; }
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.stat-card { padding:9px; background:#16213e; border-radius:5px; border:1px solid #2a2a4a; }
.stat-card.highlight { border-color:#2ecc71; background:#0d2818; }
.stat-card.highlight.global-hl { border-color:#3498db; background:#0a1a2e; }
.stat-label { font-size:10px; color:#889; margin-bottom:2px; }
.stat-value { font-size:13px; font-weight:bold; }
.eval-box { padding:10px; border-radius:5px; margin-top:6px; font-size:11px; }
.eval-box.greedy-eval { background:#1a2e1a; border:1px solid #2ecc71; }
.eval-box.global-eval { background:#1a1a3e; border:1px solid #3498db; }
.viz-bar { display:flex; gap:5px; align-items:center; margin-bottom:8px; }
select { padding:3px 6px; background:#16213e; color:#ddd; border:1px solid #333; border-radius:3px; font-size:11px; }
.step-desc { background:#16213e; padding:8px; border-radius:4px; margin-bottom:6px; font-size:12px; }
.console { background:#0a0a14; color:#0f0; padding:8px; border-radius:4px; font-family:'Consolas',monospace; font-size:10px; max-height:200px; overflow-y:auto; line-height:1.5; }
.console .dim { opacity:0.4; }
.compare-box { background:#1a1a2e; border-radius:6px; padding:10px; margin-top:10px; border:1px solid #3a3a5a; }
.compare-box h4 { font-size:12px; margin-bottom:6px; }
.compare-row { display:flex; gap:8px; font-size:11px; }
.compare-col { flex:1; padding:8px; border-radius:4px; text-align:center; }
.compare-col.greedy { background:#1a2e1a; }
.compare-col.global { background:#1a1a3e; }
.compare-col .val { font-size:18px; font-weight:bold; margin:4px 0; }
.timeline-row { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
.timeline-label { width:55px; font-size:10px; font-weight:bold; }
.timeline-sub { font-size:8px; color:#889; }
.timeline-dots { display:flex; gap:1px; flex:1; overflow-x:auto; }
.timeline-dot { width:12px; height:12px; border-radius:2px; flex-shrink:0; }
.dot-avail { background:#2ecc71; }
.dot-used { background:#e74c3c; }
.dot-cd { background:#4a4a5a; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🧠 AI迷宫玩家</h1>
    <div class="sub">算法课设 - 两个AI玩家任务 | 不同评价指标</div>
  </div>
  <div style="display:flex;gap:12px;align-items:center;">
    <div class="task-selector">
      <span style="font-size:11px;color:#889;">AI模式:</span>
      <button class="task-btn active" id="btn-mode-greedy" onclick="switchMode('greedy')">🟢 任务一：贪心拾取</button>
      <button class="task-btn" id="btn-mode-global" onclick="switchMode('global')">🔵 任务二：全局最优</button>
    </div>
  </div>
</div>

<div class="main">
  <!-- 左面板 -->
  <div class="panel" id="left-panel">
    <h3>🎮 控制面板 <span id="mode-badge" style="font-size:10px;color:#2ecc71;">[任务一：贪心]</span></h3>

    <!-- 迷宫选择器 -->
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;">
      <select id="maze-select" style="flex:1;" onchange="onMazeSelect()">
        <option value="">-- 选择迷宫 --</option>
      </select>
      <button class="btn btn-dark btn-sm" onclick="loadSelectedMaze()">📂 加载</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-green" id="btn-solve" onclick="doSolve()">▶ 运行AI</button>
      <button class="btn" style="background:#9b59b6;" onclick="doCompare()">⚖ 对比</button>
    </div>

    <div class="toast" id="toast"></div>
    <textarea id="json-input" rows="18" spellcheck="false"></textarea>
    <div style="font-size:10px;color:#889;">按 input说明.txt 格式编写JSON</div>

    <!-- 任务说明 -->
    <div id="task-desc" class="eval-box greedy-eval" style="font-size:10px;">
      <strong>📌 任务一说明：</strong>贪心实时资源拾取<br>
      视野固定3×3九宫格，每步贪心选性价比最高资源<br>
      <strong>评价指标：</strong>平均拾取资源价值（多迷宫取均值）
    </div>

    <h3 style="margin-top:6px;">📊 结果面板</h3>
    <div id="result-panel" style="font-size:12px;color:#889;text-align:center;padding:16px;">等待运行...</div>
  </div>

  <!-- 右面板 -->
  <div class="right-panel" id="right-panel">
    <h3>🗺️ 迷宫地图</h3>
    <div id="maze-static"></div>
    <div class="legend" id="legend"></div>
    <div id="anim-section" style="display:none;margin-top:12px;">
      <h3>🎬 AI路径动画</h3>
      <div class="viz-bar">
        <button class="btn btn-dark btn-sm" onclick="animStep(-1)">⏮</button>
        <button class="btn btn-dark btn-sm" id="btn-play" onclick="animToggle()">▶</button>
        <button class="btn btn-dark btn-sm" onclick="animStep(1)">⏭</button>
        <button class="btn btn-dark btn-sm" onclick="animReset()">⏹</button>
        <span style="font-size:11px;margin-left:6px;" id="step-info">步骤 0/0</span>
        <span style="font-size:10px;">速度:</span>
        <select id="speed-select" onchange="setSpeed(this.value)">
          <option value="600">慢</option>
          <option value="300" selected>中</option>
          <option value="100">快</option>
          <option value="30">极快</option>
        </select>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <div id="maze-anim"></div>
        <div style="flex:1;min-width:160px;">
          <div class="step-desc" id="step-desc">准备开始...</div>
          <!-- 动画实时收益面板 -->
          <div id="anim-reward-panel" style="display:flex;gap:8px;margin-bottom:6px;font-size:11px;font-weight:bold;flex-wrap:wrap;">
            <div style="background:#16213e;border:1px solid #2a2a4a;border-radius:5px;padding:6px 10px;display:flex;align-items:center;gap:4px;">
              <span>👣</span><span>步数:</span><span id="anim-step-count" style="color:#aab;">0</span>
            </div>
            <div style="background:#16213e;border:1px solid #2a2a4a;border-radius:5px;padding:6px 10px;display:flex;align-items:center;gap:4px;">
              <span>💰</span><span>金币:</span><span id="anim-coin-count" style="color:#ffd700;">0</span>
            </div>
            <div style="background:#16213e;border:1px solid #2a2a4a;border-radius:5px;padding:6px 10px;display:flex;align-items:center;gap:4px;">
              <span>💀</span><span>陷阱:</span><span id="anim-trap-count" style="color:#e74c3c;">0</span>
            </div>
            <div style="background:#16213e;border:1px solid #2a2a4a;border-radius:5px;padding:6px 10px;display:flex;align-items:center;gap:4px;">
              <span>📈</span><span>净收益:</span><span id="anim-net-gold" style="color:#2ecc71;">0</span>
            </div>
          </div>
          <div id="score-panel" style="display:flex;flex-direction:column;gap:4px;margin-bottom:6px;"></div>
          <div class="console" id="step-log"></div>
        </div>
      </div>
    </div>
    <!-- 战斗详情（运行后显示） -->
    <div id="battle-section" style="display:none;margin-top:12px;">
      <h3>⚔️ 战斗详情</h3>
      <div id="timeline"></div>
      <div style="margin-top:8px;">
        <h3 style="font-size:12px;">📝 战斗日志</h3>
        <div class="console" id="battle-log" style="max-height:250px;"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ======== 全局状态 ========
let currentMode = 'greedy';  // 'greedy' | 'global'
let maze = [];
let result = null;
let compareResult = null;
let animSteps = [], animIdx = 0, animTimer = null, animSpeed = 300;
let animRunningGold = 0, animRunningDamage = 0, animRunningCoins = 0, animRunningTraps = 0;
let playerSkills = [], bossHPs = [];

const DEFAULT_JSON = JSON.stringify({
  maze: [
    ["#","#","#","#","#","#","#","#","#","#","#","S","#","#","#"],
    ["#"," ","G","T","G","#"," "," "," "," "," "," "," "," ","#"],
    ["#","#","#","G","#","#","#"," ","#","#","#","#","#","#","#"],
    ["#"," ","T"," "," "," ","#"," "," "," ","#"," ","#","G","#"],
    ["#","#","#"," ","#"," ","#","#","#"," ","#"," ","#","G","#"],
    ["#"," ","G"," ","#"," ","#","G"," "," "," "," ","G","T","#"],
    ["#","#","#"," ","#"," ","#","#","#","#","#","T","#","T","#"],
    ["#"," ","#"," ","#"," ","#"," "," "," "," "," ","#"," ","#"],
    ["#","T","#"," ","#"," ","#","#","#"," ","#","#","#"," ","#"],
    ["#"," "," "," ","#"," "," "," "," "," "," "," ","#"," ","#"],
    ["#"," ","#","#","#","#","#","#","#","#","#","#","#","#","#"],
    ["#"," "," "," ","#","G","#"," ","T"," ","#","G","T"," ","#"],
    ["#","#","#"," ","#","T","#"," ","#","#","#","#","#"," ","#"],
    ["#"," "," "," "," "," "," "," ","B"," "," "," ","T","G","#"],
    ["#","#","#","#","#","#","#","#","#","E","#","#","#","#","#"]
  ],
  B: [11,13,9,15],
  PlayerSkills: [[8,4],[2,0],[4,2],[6,3]],
  minRouds: 20,
  CoinConsumption: 5
}, null, 2);

document.getElementById('json-input').value = DEFAULT_JSON;

// ======== 模式切换 ========
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.task-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-mode-' + mode).classList.add('active');
  document.getElementById('greedy-params').style.display = mode === 'greedy' ? 'flex' : 'none';
  const desc = document.getElementById('task-desc');
  const badge = document.getElementById('mode-badge');
  if (mode === 'greedy') {
    desc.className = 'eval-box greedy-eval';
    desc.innerHTML = '<strong>📌 任务一说明：</strong>贪心实时资源拾取<br>视野受限(可调)，每步贪心选性价比最高资源<br><strong>评价指标：</strong>平均拾取资源价值（多迷宫取均值）';
    badge.innerHTML = '[任务一：贪心]';
    badge.style.color = '#2ecc71';
  } else {
    desc.className = 'eval-box global-eval';
    desc.innerHTML = '<strong>📌 任务二说明：</strong>全局最优探索<br>全迷宫已知，DP路径规划 + 分支定界Boss战<br><strong>评价指标：</strong>抵终点时剩余资源价值';
    badge.innerHTML = '[任务二：全局最优]';
    badge.style.color = '#3498db';
  }
  result = null;
  compareResult = null;
  document.getElementById('anim-section').style.display = 'none';
  document.getElementById('battle-section').style.display = 'none';
  renderResult();
}

// ======== API调用 ========
function getApiEndpoint() {
  return currentMode === 'greedy' ? '/api/solve/greedy' : '/api/solve/global';
}

async function doSolve() {
  const btn = document.getElementById('btn-solve');
  btn.disabled = true;
  btn.textContent = '⏳ 计算中...';
  try {
    const data = JSON.parse(document.getElementById('json-input').value);
    maze = data.maze;
    playerSkills = data.PlayerSkills || [];
    bossHPs = data.B || [];
    const res = await fetch(getApiEndpoint(), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || '请求失败'); }
    result = await res.json();
    renderStaticMaze();
    renderResult();
    buildAnimSteps();
    document.getElementById('anim-section').style.display = 'block';
    animReset();
    renderBattleTab(0);
    showToast('求解完成! (' + (currentMode === 'greedy' ? '贪心' : '全局最优') + ')', 'success');
  } catch(e) { showToast(e.message, 'error'); result = null; }
  btn.disabled = false;
  btn.textContent = '▶ 运行AI';
}

async function doCompare() {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳ 对比中...';
  try {
    const data = JSON.parse(document.getElementById('json-input').value);
    maze = data.maze; playerSkills = data.PlayerSkills || []; bossHPs = data.B || [];
    const res = await fetch('/api/compare', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || '请求失败'); }
    compareResult = await res.json();
    renderCompareResult();
    showToast('对比完成!', 'success');
  } catch(e) { showToast(e.message, 'error'); }
  btn.disabled = false;
  btn.textContent = '⚖ 对比';
}

function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast ' + type; setTimeout(() => { t.className = 'toast'; }, 4000); }

// ======== 迷宫渲染 ========
function cellColor(r, c, ch, onPath) {
  if (ch === '#') return '#1a1a2e';
  if (ch === 'S') return onPath ? 'rgba(46,204,113,0.3)' : '#4ecdc4';
  if (ch === 'E') return onPath ? 'rgba(46,204,113,0.3)' : '#ff6b6b';
  if (ch === 'B') return '#e74c3c';
  if (ch === 'G') return onPath ? 'rgba(46,204,113,0.3)' : '#ffd700';
  if (ch === 'T') return onPath ? 'rgba(46,204,113,0.3)' : '#ff6b6b';
  return onPath ? 'rgba(46,204,113,0.15)' : '#2a2a3e';
}

function cellIcon(ch) { if (ch === 'S') return 'S'; if (ch === 'E') return 'E'; if (ch === 'B') return '👹'; if (ch === 'G') return '💰'; if (ch === 'T') return '💀'; return ''; }

function renderMaze(containerId, pathSet, playerPos) {
  if (!maze.length) return;
  const rows = maze.length, cols = maze[0].length, size = 28;
  let html = `<div class="maze-grid" style="grid-template-columns:repeat(${cols},${size}px);grid-template-rows:repeat(${rows},${size}px);">`;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = maze[r][c], onPath = pathSet.has(r+','+c), isPlayer = playerPos && playerPos[0]===r && playerPos[1]===c;
      let bg = cellColor(r,c,ch,onPath), icon = cellIcon(ch);
      if (isPlayer) { bg = '#2ecc71'; icon = '🧠'; }
      html += `<div class="cell" style="width:${size}px;height:${size}px;background:${bg};color:#1a1a2e;" title="(${r},${c}) ${ch}">${icon}</div>`;
    }
  }
  html += '</div>';
  document.getElementById(containerId).innerHTML = html;
}

function renderStaticMaze() { renderMaze('maze-static', new Set(), null); renderLegend(); }

function renderLegend() {
  document.getElementById('legend').innerHTML = `
    <div class="legend-item"><div class="legend-sq" style="background:#4ecdc4"></div>S起点</div>
    <div class="legend-item"><div class="legend-sq" style="background:#ff6b6b"></div>E终点</div>
    <div class="legend-item"><div class="legend-sq" style="background:#e74c3c"></div>Boss</div>
    <div class="legend-item"><div class="legend-sq" style="background:#ffd700"></div>金币+50</div>
    <div class="legend-item"><div class="legend-sq" style="background:#ff6b6b"></div>陷阱-30</div>
    <div class="legend-item"><div class="legend-sq" style="background:#1a1a2e"></div>墙壁</div>
    <div class="legend-item"><div class="legend-sq" style="background:#2ecc71"></div>AI路径</div>`;
}

// ======== 结果面板 ========
function renderResult() {
  const panel = document.getElementById('result-panel');
  if (!result || !result.success) {
    if (compareResult) { renderCompareResult(); return; }
    panel.innerHTML = '<div style="text-align:center;padding:16px;color:#889;">等待运行...</div>';
    return;
  }
  const s = result.stats;
  const isGreedy = currentMode === 'greedy';
  const hlClass = isGreedy ? 'highlight' : 'highlight global-hl';

  let html = `<div class="stat-grid">`;
  html += `<div class="stat-card"><div class="stat-label">收集金币</div><div class="stat-value">💰 ${s.totalCoins}</div></div>`;
  html += `<div class="stat-card"><div class="stat-label">陷阱伤害</div><div class="stat-value">💀 -${s.trapDamage}</div></div>`;
  html += `<div class="stat-card"><div class="stat-label">路径长度</div><div class="stat-value">👣 ${s.pathLength}步</div></div>`;
  html += `<div class="stat-card"><div class="stat-label">击败Boss</div><div class="stat-value">${s.bossDefeated?'✅ 是':'❌ 否'}</div></div>`;
  html += `<div class="stat-card"><div class="stat-label">使用回合</div><div class="stat-value">⏱ ${s.roundsUsed}/${s.minRounds}</div></div>`;
  html += `<div class="stat-card"><div class="stat-label">复活消耗</div><div class="stat-value">🪙 ${s.revivalCost}</div></div>`;
  html += `<div class="stat-card ${hlClass}"><div class="stat-label">净收益</div><div class="stat-value">📈 ${s.netCoins}金币</div></div>`;
  html += `<div class="stat-card"><div class="stat-label">收集金币数</div><div class="stat-value">📊 ${s.collectedGolds}个</div></div>`;

  if (isGreedy && s.trapsHit !== undefined) {
    html += `<div class="stat-card"><div class="stat-label">触发陷阱次数</div><div class="stat-value">⚠️ ${s.trapsHit}次</div></div>`;
  }
  html += `</div>`;

  // 评价指标提示
  html += `<div class="eval-box ${isGreedy?'greedy-eval':'global-eval'}">`;
  html += `<strong>📊 评价指标：</strong>`;
  html += isGreedy
    ? `平均拾取资源价值 = ${s.totalCoins} - ${s.trapDamage} = <strong>${s.netCoins}</strong> 金币<br><span style="font-size:10px;color:#889;">（需在多个不同迷宫上运行取均值）</span>`
    : `抵终点时剩余资源价值 = <strong>${s.netCoins}</strong> 金币<br><span style="font-size:10px;color:#889;">（值越大越好，同时参考 ${s.pathLength} 步的步数基准）</span>`;
  html += `</div>`;

  panel.innerHTML = html;
}

function renderCompareResult() {
  if (!compareResult) return;
  const g = compareResult.greedy.stats;
  const gl = compareResult.global.stats;
  const c = compareResult.comparison;

  const panel = document.getElementById('result-panel');
  let html = `<div class="compare-box">`;
  html += `<h4>⚖ 两个任务对比</h4>`;
  html += `<div class="compare-row">`;
  html += `<div class="compare-col greedy"><div style="font-size:10px;color:#2ecc71;">🟢 任务一：贪心</div><div class="val" style="color:#2ecc71;">${g.netCoins}</div><div style="font-size:10px;">净收益</div><div style="font-size:9px;color:#889;">路径:${g.pathLength}步 | 金币:${g.totalCoins}</div></div>`;
  html += `<div class="compare-col global"><div style="font-size:10px;color:#3498db;">🔵 任务二：全局最优</div><div class="val" style="color:#3498db;">${gl.netCoins}</div><div style="font-size:10px;">净收益</div><div style="font-size:9px;color:#889;">路径:${gl.pathLength}步 | 金币:${gl.totalCoins}</div></div>`;
  html += `</div>`;
  html += `<div style="margin-top:6px;font-size:10px;text-align:center;">`;
  html += `净收益差: <strong>${c.netCoinsDiff > 0 ? '+' : ''}${c.netCoinsDiff}</strong>金币 | `;
  html += `路径差: <strong>${c.pathLengthDiff > 0 ? '+' : ''}${c.pathLengthDiff}</strong>步 | `;
  html += `更优策略: <strong style="color:${c.betterStrategy==='global'?'#3498db':'#2ecc71'}">${c.betterStrategy==='global'?'任务二：全局最优':'任务一：贪心'}</strong>`;
  html += `</div></div>`;
  panel.innerHTML = html;
}

// ======== 动画 ========
function buildAnimSteps() {
  animSteps = [];
  if (!result || !result.path) return;

  // 追踪已收集的位置（每个金币/陷阱只触发一次）
  const collected = new Set();

  // 辅助函数：为路径点创建移动步骤，检测是否踩金币或陷阱
  function makeMoveStep(pos) {
    const [r, c] = pos;
    const key = r + ',' + c;
    const ch = (maze[r] && maze[r][c]) ? maze[r][c] : '';
    let desc = `移动到 (${r}, ${c})`;
    let coin = false, trap = false;
    if (ch === 'G' && !collected.has(key)) {
      coin = true;
      collected.add(key);
      desc += ' 💰 收集金币 +50';
    } else if (ch === 'T' && !collected.has(key)) {
      trap = true;
      collected.add(key);
      desc += ' 💀 触发陷阱 -30';
    }
    return { type:'move', pos, desc, coin, trap };
  }

  // 找到路径中Boss的位置（B所在索引）
  let bossIdx = -1;
  for (let i = 0; i < result.path.length; i++) {
    const [r, c] = result.path[i];
    if (maze[r] && maze[r][c] === 'B') { bossIdx = i; break; }
  }

  if (bossIdx >= 0) {
    // S→B 的移动步骤
    for (let i = 0; i <= bossIdx; i++) {
      animSteps.push(makeMoveStep(result.path[i]));
    }
    // Boss战斗动画（在B位置）
    animSteps.push({ type:'boss', desc:'⚔️ 开始Boss战!' });
    const minRounds = result.stats.minRounds || 999;
    const revivalCost = result.stats.revivalCost || 0;
    let revived = false;
    (result.skillSequence||[]).forEach(sk => {
      // 在回合耗尽的那一步之前插入复活提示
      if (revivalCost > 0 && !revived && sk.round > minRounds) {
        revived = true;
        const numRevivals = Math.ceil((result.stats.roundsUsed - minRounds) / minRounds);
        animSteps.push({ type:'revival', desc:`💀 回合耗尽! 复活${numRevivals}次(获得${numRevivals * minRounds}回合), 消耗${revivalCost}金币` });
      }
      animSteps.push({ type:'skill', desc:`⚔️ 回合${sk.round}: 技能${sk.skillIndex} → Boss${sk.targetBoss}` });
    });
    animSteps.push({ type:'boss-done', desc:'✅ Boss战胜利! 继续前进' });
    // B→E 的移动步骤
    for (let i = bossIdx + 1; i < result.path.length; i++) {
      animSteps.push(makeMoveStep(result.path[i]));
    }
  } else {
    // 无Boss：直接全部路径
    result.path.forEach(p => animSteps.push(makeMoveStep(p)));
    (result.skillSequence||[]).forEach(sk => animSteps.push({ type:'skill', desc:`⚔️ 回合${sk.round}: 技能${sk.skillIndex} → Boss${sk.targetBoss}` }));
  }
  animSteps.push({ type:'done', desc:'任务完成!' });
}

function animReset() { animStop(); animIdx = 0; animRunningGold = 0; animRunningDamage = 0; animRunningCoins = 0; animRunningTraps = 0; renderAnimFrame(); }
function animStop() { if (animTimer) { clearInterval(animTimer); animTimer = null; } document.getElementById('btn-play').textContent = '▶'; }
function animToggle() { if (animTimer) { animStop(); return; } animTimer = setInterval(() => animStep(1), animSpeed); document.getElementById('btn-play').textContent = '⏸'; }
function setSpeed(v) { animSpeed = parseInt(v); if (animTimer) { animStop(); animToggle(); } }
function animStep(delta) {
  const n = Math.max(0, Math.min(animSteps.length-1, animIdx+delta));
  if (n === animIdx) { if (n >= animSteps.length-1) animStop(); return; }
  animIdx = n; renderAnimFrame();
  if (animIdx >= animSteps.length-1) animStop();
}

function renderAnimFrame() {
  if (!animSteps.length) return;
  const step = animSteps[animIdx], pathSet = new Set();
  for (let i = 0; i <= animIdx; i++) { if (animSteps[i].pos) pathSet.add(animSteps[i].pos[0]+','+animSteps[i].pos[1]); }
  renderMaze('maze-anim', pathSet, step.pos||null);
  document.getElementById('step-desc').textContent = step.desc;
  document.getElementById('step-info').textContent = `步骤 ${animIdx+1}/${animSteps.length}`;

  // 计算实时收益：遍历已播放的步骤，累加踩到的金币和陷阱（每格只计一次）
  const collectedSet = new Set();
  animRunningGold = 0; animRunningDamage = 0; animRunningCoins = 0; animRunningTraps = 0;
  for (let i = 0; i <= animIdx; i++) {
    const s = animSteps[i];
    if (s.pos) {
      const key = s.pos[0] + ',' + s.pos[1];
      if (!collectedSet.has(key)) {
        const ch = (maze[s.pos[0]] && maze[s.pos[0]][s.pos[1]]) ? maze[s.pos[0]][s.pos[1]] : '';
        if (ch === 'G') {
          collectedSet.add(key);
          animRunningCoins++;
          animRunningGold += 50;
        } else if (ch === 'T') {
          collectedSet.add(key);
          animRunningTraps++;
          animRunningDamage += 30;
        }
      }
    }
  }
  // 检查是否已播放到复活步骤
  let revivalCost = 0;
  for (let i = 0; i <= animIdx; i++) {
    if (animSteps[i].type === 'revival') {
      revivalCost = result.stats.revivalCost || 0;
      break;
    }
  }
  const animRunningNet = animRunningGold - animRunningDamage - revivalCost;
  document.getElementById('anim-coin-count').textContent = animRunningCoins + '个 (+' + animRunningGold + ')';
  document.getElementById('anim-trap-count').textContent = animRunningTraps + '次 (-' + animRunningDamage + ')';
  const netEl = document.getElementById('anim-net-gold');
  netEl.textContent = revivalCost > 0 ? animRunningNet + ' (复活-' + revivalCost + ')' : animRunningNet;
  netEl.style.color = animRunningNet >= 0 ? '#2ecc71' : '#e74c3c';

  // 统计移动步数（不包含Boss战斗步）
  let moveCount = 0;
  for (let i = 0; i <= animIdx; i++) {
    if (animSteps[i].type === 'move') moveCount++;
  }
  document.getElementById('anim-step-count').textContent = moveCount;

  // 方向评分可视化
  // 注意：animIdx 包含Boss战动画步，需折算为移动步索引
  const scorePanel = document.getElementById('score-panel');
  let moveIdx = -1;
  for (let i = 0; i <= animIdx; i++) {
    if (animSteps[i].type === 'move') moveIdx++;
  }
  if (result && result.stepScores && moveIdx >= 0 && moveIdx < result.stepScores.length && step.type === 'move') {
    const sc = result.stepScores[moveIdx];
    if (sc && sc.scores) {
      const arrows = {'(-1,+0)':'↑','(+1,+0)':'↓','(0,-1)':'←','(0,+1)':'→'};
      let html = '';
      const entries = Object.entries(sc.scores);
      entries.sort((a,b) => b[1].score - a[1].score);
      for (const [dir, info] of entries) {
        const arrow = arrows[dir] || dir;
        const isWall = info.ch === '#';
        const bg = info.chosen ? '#0d2818' : isWall ? '#1a1a1a' : '#16213e';
        const border = info.chosen ? '2px solid #2ecc71' : '1px solid #2a2a4a';
        const scoreColor = info.score >= 0 ? '#2ecc71' : '#e74c3c';
        const chIcon = info.ch === 'G' ? '💰' : info.ch === 'T' ? '💀' : info.ch === '#' ? '🧱' : '⬜';
        const scoreText = isWall ? '墙' : (info.score>=0?'+':'')+info.score.toFixed(1);
        html += `<div style="background:${bg};border:${border};border-radius:6px;padding:6px 8px;font-size:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:13px;">${arrow} (${info.pos[0]},${info.pos[1]}) ${chIcon}</span>
            <span style="color:${isWall?'#666':scoreColor};font-weight:bold;font-size:14px;">${scoreText}</span>
          </div>
          <div style="color:#aab;font-size:11px;margin-top:2px;">${info.details.join(' ')}</div>
        </div>`;
      }
      scorePanel.innerHTML = html;
    } else {
      scorePanel.innerHTML = '';
    }
  } else {
    scorePanel.innerHTML = '';
  }

  const start = Math.max(0, animIdx-4);
  let log = '';
  for (let i = start; i <= animIdx; i++) {
    const s = animSteps[i], cls = i === animIdx ? '' : 'dim';
    let icon = '🚶';
    if (s.type==='skill') icon='⚔️';
    else if (s.type==='boss') icon='👹';
    else if (s.type==='revival') icon='🪙';
    else if (s.type==='boss-done') icon='🏆';
    else if (s.type==='done') icon='✅';
    log += `<div class="${cls}">${icon} ${s.desc}</div>`;
  }
  document.getElementById('step-log').innerHTML = log;

  // 战斗详情与动画同步：统计已播放的技能数
  let skillCount = 0;
  for (let i = 0; i <= animIdx; i++) {
    if (animSteps[i].type === 'skill') skillCount++;
  }
  if (result && result.skillSequence && result.skillSequence.length > 0) {
    renderBattleTab(skillCount);
  }
}

// ======== 战斗详情 ========
function renderBattleTab(animatedSkillCount) {
  const section = document.getElementById('battle-section');
  const allSkills = (result && result.skillSequence) || [];
  if (!result || !result.success || !allSkills.length) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';

  // animatedSkillCount: 动画已播放的技能数，undefined表示全部
  const showAll = (animatedSkillCount === undefined);
  const skills = showAll ? allSkills : allSkills.slice(0, animatedSkillCount);
  const maxRound = Math.max(...allSkills.map(s=>s.round), result.stats.roundsUsed);
  const animatedMaxRound = skills.length > 0 ? Math.max(...skills.map(s=>s.round)) : 0;

  // 技能时间线
  let html = '';
  for (let si = 0; si < playerSkills.length; si++) {
    const [dmg, cd] = playerSkills[si];
    let dots = '';
    for (let r = 1; r <= maxRound; r++) {
      if (r > animatedMaxRound && !showAll) {
        // 尚未播放到的回合，灰色占位
        dots += `<div class="timeline-dot" style="background:#2a2a3e;" title="回合${r}: 等待中"></div>`;
      } else {
        const used = skills.some(s=>s.skillIndex===si && s.round===r);
        let onCD = false;
        if (!used) {
          let last = -1;
          for (const s of skills) { if (s.skillIndex===si && s.round<r) last = Math.max(last, s.round); }
          if (last !== -1 && r - last <= cd) onCD = true;
        }
        dots += `<div class="timeline-dot ${used?'dot-used':onCD?'dot-cd':'dot-avail'}" title="回合${r}: ${used?'释放':onCD?'冷却':'可用'}"></div>`;
      }
    }
    html += `<div class="timeline-row"><div class="timeline-label">技能${si}<div class="timeline-sub">伤${dmg}冷${cd}</div></div><div class="timeline-dots">${dots}</div></div>`;
  }

  // Boss血量（根据已播放技能扣减）
  const remainHP = [...bossHPs];
  for (const sk of skills) {
    remainHP[sk.targetBoss] -= (playerSkills[sk.skillIndex]||[0,0])[0];
  }
  html += '<div style="margin-top:6px;"><div style="font-size:11px;font-weight:bold;margin-bottom:3px;">Boss血量</div>';
  for (let bi=0; bi<bossHPs.length; bi++) {
    const hp = Math.max(0, remainHP[bi]);
    const pct = bossHPs[bi] > 0 ? hp / bossHPs[bi] : 0;
    const barLen = Math.max(0, Math.round(pct * 25));
    const barColor = pct > 0.5 ? '#e74c3c' : pct > 0.2 ? '#e67e22' : '#c0392b';
    html += `<div style="font-size:10px;margin-bottom:2px;display:flex;align-items:center;gap:4px;">
      Boss${bi}<span style="color:${barColor};">${'█'.repeat(barLen)}${'░'.repeat(25-barLen)}</span> ${hp}/${bossHPs[bi]}
    </div>`;
  }
  html += '</div><div style="display:flex;gap:10px;font-size:9px;color:#889;margin-top:4px;"><span>🟢可用</span><span>🔴释放</span><span>⬜冷却</span><span style="color:#2a2a3e;">⬛等待</span></div>';
  document.getElementById('timeline').innerHTML = html;

  // 战斗日志
  let log = '';
  for (const sk of skills) { const sd = playerSkills[sk.skillIndex]||[0,0]; log += `[${String(sk.round).padStart(3)}] 技能${sk.skillIndex}(伤${sd[0]}) → Boss${sk.targetBoss}\n`; }
  if (showAll && skills.length > 0) log += '\n--- 战斗结束 ---';
  document.getElementById('battle-log').textContent = log;
}

// ======== 迷宫选择器 ========
let mazeList = [];
async function loadMazeList() {
  try {
    const res = await fetch('/api/mazes');
    const data = await res.json();
    mazeList = data.mazes;
    const sel = document.getElementById('maze-select');
    sel.innerHTML = '<option value="">-- 选择迷宫 --</option>';
    mazeList.forEach((m, i) => {
      sel.innerHTML += `<option value="${i}">${m.name} (${m.size}) 💰${m.goldCount} 💀${m.trapCount}</option>`;
    });
  } catch(e) { console.error('加载迷宫列表失败', e); }
}
function onMazeSelect() { /* 仅选中，等点加载按钮 */ }
async function loadSelectedMaze() {
  const idx = document.getElementById('maze-select').value;
  if (idx === '') return;
  const m = mazeList[parseInt(idx)];
  try {
    const res = await fetch('/api/data/' + m.file);
    const data = await res.json();
    document.getElementById('json-input').value = JSON.stringify(data, null, 2);
    maze = data.maze; playerSkills = data.PlayerSkills || []; bossHPs = data.B || [];
    result = null; compareResult = null;
    document.getElementById('anim-section').style.display = 'none';
    renderStaticMaze(); renderResult();
    showToast(`已加载: ${m.name}`, 'success');
  } catch(e) { showToast('加载失败: ' + e.message, 'error'); }
}

(() => {
  const d = JSON.parse(DEFAULT_JSON); maze = d.maze; playerSkills = d.PlayerSkills; bossHPs = d.B;
  renderStaticMaze(); renderLegend();
  loadMazeList();
})();
